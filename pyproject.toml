[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgepulse-delivery"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.6", "prometheus-client==0.21.1", "uvicorn==0.34.0"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.3.4", "ruff==0.9.3"]

[tool.setuptools.packages.find]
include = ["forgepulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
