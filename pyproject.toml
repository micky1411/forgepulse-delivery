[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgepulse-delivery"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "prometheus-client==0.26.0",
  "starlette==1.6.0",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.3.4", "ruff==0.9.3"]

[tool.setuptools.packages.find]
include = ["forgepulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
