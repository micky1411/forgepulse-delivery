apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: forgepulse-dev, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/micky1411/forgepulse-delivery.git
    targetRevision: main
    path: helm/forgepulse
  destination: {server: https://kubernetes.default.svc, namespace: forgepulse-dev}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
