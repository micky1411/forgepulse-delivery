apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}, labels: {app.kubernetes.io/name: {{ .Chart.Name }}}}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Chart.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Chart.Name }}}
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: "/metrics", prometheus.io/port: "8080"}
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: forgepulse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: APP_VERSION, value: {{ .Chart.AppVersion | quote }}}
            - {name: GIT_SHA, value: {{ .Values.release.gitSha | quote }}}
            - {name: ENVIRONMENT, value: {{ .Values.environment | quote }}}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 10}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
